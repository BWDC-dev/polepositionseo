name: build
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps hand-off: pin the new immutable tag in the homelab-cluster repo. Argo CD (in the cluster) sees the
  # commit and rolls the Deployment — GitHub never needs network access to the cluster.
  # Needs a repo secret CLUSTER_REPO_TOKEN: fine-grained PAT with Contents: read/write on homelab-cluster.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homelab-cluster
          token: ${{ secrets.CLUSTER_REPO_TOKEN }}
      - name: bump image tag
        run: |
          set -e
          FILE=sites/polepositionseo/app.yaml
          sed -i -E "s#(image: ghcr.io/${{ github.repository_owner }}/polepositionseo):.*#\1:${{ needs.build.outputs.tag }}#" "$FILE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "polepositionseo: deploy ${{ needs.build.outputs.tag }}" || echo "no change"
          git push
